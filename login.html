<!DOCTYPE html>
<html>
<head>

    <title>Login</title>
<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f1f5fb;
    color: #26364a;
}

.page {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 400px;
    background-color: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 15px #00000015;
}

h1 {
    margin-top: 0;
    color: #365fc0;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 11px;
    border: 1px solid #cbd4df;
    border-radius: 6px;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    color: white;
    background-color: #4776e6;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

a {
    color: #365fc0;
}

.note {
    color: #687589;
    font-size: 14px;
}
</style>
</head>
<body>
    <div class="page">
        <div class="card">
            <h1>Study Circle</h1>
            <h2>Login</h2>
            <p class="note">Welcome back! Enter your details below.</p>

            <form>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Your password" required>

                <button type="submit">Login</button>
            </form>

            <p>New student? <a href="registration.html">Create an account</a></p>
        </div>
    </div>
</body>
</html>
